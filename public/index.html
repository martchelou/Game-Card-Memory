<!DOCTYPE html>
<html lang="en">
<head>
    <base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- seo -->
    <meta name="keywords" content="Game, Card game, pokemon, memory">
    <meta name="description" content="A Pokémon Memory Card Game">
    <!-- links fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- links style -->
    <link rel="shortcut icon" href="img/dice-6-fill.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <!-- script -->
    <script defer src="js/main.min.js"> // =] </script>

    <title>Memory Game</title>
</head>
<body class="bg-light">
    <header>
        <div class="container-fluid">
            <nav id="game-menu" class="position-absolute float-start my-2">
                <button id="new-game" class="btn btn-secondary">
                    <i class="bi bi-controller"></i>
                    <span class="d-none d-md-inline ps-2">New Game</span>
                </button>
            </nav>
            <h1 class="fw-light text-center m-0 px-0 py-2">
                <a data-action="content" href="/" class=" bg-white px-2 rounded shadow text-decoration-none text-dark">Memory <span class="d-none d-md-inline">Game</span></a>
            </h1>
        </div>
    </header>
    <main class="mb-5 pb-5 min-vh-100 d-flex justify-content-center align-items-center">
        <div id="content" class="container-fluid">
            <span class="spinner">Loading</span>
        </div>
    </main>
    <section id="game-info" class="position-absolute end-0 top-0 text-center mt-2 me-2">
        <div class="btn-group">
            <div class="bg-light border rounded-pill rounded-end px-2 py-1">
                <i class="bi bi-arrow-clockwise text-primary"></i>
                <strong class="d-none d-md-inline small text-secondary">Turns:</strong>
                <span id="turn_count" class="fw-bold">0</span>
            </div>
            <div class="bg-light border px-2 py-1">
                <i class="bi bi-bar-chart-line text-danger"></i>
                <strong class="d-none d-md-inline small text-secondary">Attempts:</strong>
                <span id="attempt_count" class="fw-bold">0</span>
            </div>
            <div class="bg-light border px-2 py-1 rounded-pill rounded-start">
                <i class="bi bi-trophy-fill text-warning"></i>
                <strong class="d-none d-md-inline small text-secondary">Wins:</strong>
                <span id="win_count" class="fw-bold">0</span>
            </div>
        </div>
    </section>
    <footer class="fixed-bottom bg-secondary text-white-50 py-2">
        <div class="container-fluid">
            <div class="d-flex justify-content-between align-items-center">
                <p id="date" class="m-0">{{Since 2026-10-14}}</p>
                <nav class="btn-group">
                    <a data-action="content" href="#home" class="btn btn-sm btn-secondary"><i class="bi bi-controller"></i><span class="ps-2 d-none d-md-inline">Memory Game</span></a>
                    <a data-action="content" href="#about" class="btn btn-sm btn-secondary"><i class="bi bi-info-circle-fill"></i><span class="ps-2 d-none d-md-inline">About</span></a>
                    <a data-action="content" href="#privacy" class="btn btn-sm btn-secondary"><i class="bi bi-shield-fill-check"></i><span class="ps-2 d-none d-md-inline">Privacy</span></a>
                    <a href="https://underface.com" target="_blank" rel="noopener" class="btn btn-sm btn-secondary">].u.[</a>
                </nav>
            </div>
        </div>
    </footer>
    <dialog id="modal">
        <button id="modal-close-btn" class="btn" aria-label="fechar">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-x-lg"
                viewBox="0 0 16 16">
                <path
                    d="M2.146 2.854a.5.5 0 1 1 .708-.708L8 7.293l5.146-5.147a.5.5 0 0 1 .708.708L8.707 8l5.147 5.146a.5.5 0 0 1-.708.708L8 8.707l-5.146 5.147a.5.5 0 0 1-.708-.708L7.293 8z" />
            </svg>
        </button>
        <div id="modal-body">
            <div class="d-block mx-auto border-1 spinner-border" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>
    </dialog>
</body>
</html>
